<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>myAko Supervisions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>

<!-- Clickable prototype of the supervisions dashboard. All figures are
     derived from data.js by app.js; nothing on the page is hand-typed. -->
<div class="app" id="app">

  <nav class="nav" aria-label="Main">
    <div class="nav-top">
      <div class="nav-brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="5.5" fill="currentColor"/>
          <g fill="currentColor" opacity="0.45">
            <circle cx="16" cy="4.5" r="2.4"/><circle cx="26" cy="11" r="2.4"/><circle cx="24.5" cy="24.5" r="2.4"/>
            <circle cx="7.5" cy="24.5" r="2.4"/><circle cx="6" cy="11" r="2.4"/>
          </g>
        </svg>
        <span class="brand-word">my<b>Ako</b></span>
        <button class="icon-btn" id="btn-menu" aria-label="Collapse navigation" title="Collapse navigation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
        </button>
      </div>
    </div>
    <div class="nav-scroll">
      <ul id="nav-list"></ul>
    </div>
    <div class="nav-foot">
      <div class="promo" id="promo">
        <button class="icon-btn" id="promo-close" aria-label="Dismiss"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <strong>CQC evidence pack</strong>
        <p>Inspection window opens 1 October. Export your Q1 pack by 25 September.</p>
        <button class="btn sm primary" data-go="/reports/suite">Open reporting suite</button>
      </div>
      <div class="me-wrap" data-menu-wrap>
        <button class="me" id="btn-role" aria-haspopup="menu" aria-expanded="false">
          <span class="avatar me-av" id="me-avatar">JO</span>
          <span class="who"><strong>James Okafor</strong><span id="me-role">Registered Manager · Northfield House</span></span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg>
        </button>
        <div class="menu up" id="role-menu" role="menu" hidden></div>
      </div>
    </div>
  </nav>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="btn-nav-open" aria-label="Open navigation" title="Open navigation" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <nav class="crumb" id="crumb" aria-label="You are here" hidden></nav>
      <button class="search" id="search-open" type="button" aria-label="Search and go to (⌘K)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
        <span class="ph">Search or go to…</span>
        <span class="kbd">⌘K</span>
      </button>
      <span class="spacer"></span>
      <button class="icon-btn" id="btn-theme" aria-label="Toggle dark mode" title="Toggle dark mode (D)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn" id="btn-help" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg>
      </button>
      <button class="icon-btn" id="btn-notes" aria-label="Prototype notes" title="Prototype notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      </button>
      <button class="icon-btn" id="btn-chat" aria-label="Messages" title="Messages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 016.5 3h11A2.5 2.5 0 0120 5.5v8a2.5 2.5 0 01-2.5 2.5H9l-5 4v-4H6.5A2.5 2.5 0 014 13.5v-8z"/></svg>
        <span class="dot" id="chat-dot">2</span>
      </button>
      <button class="icon-btn" id="btn-bell" aria-label="Notifications" title="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0112 0v5l1.5 2h-15L6 16zM10 20a2 2 0 004 0"/></svg>
        <span class="dot" id="bell-dot">4</span>
      </button>
    </header>

    <div class="announce" id="announce">
      <button class="icon-btn" id="announce-prev" aria-label="Previous message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span class="txt" id="announce-text"></span>
      <span class="count" id="announce-count"></span>
      <button class="icon-btn" id="announce-next" aria-label="Next message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="icon-btn" id="announce-close" aria-label="Dismiss system messages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <main class="page" id="page">
      <div class="page-inner" id="page-inner"></div>
    </main>
  </div>

  <aside class="panel" id="panel" aria-label="Side panel">
    <div class="panel-inner">
      <div class="panel-head">
        <button class="icon-btn" id="panel-back" aria-label="Back" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <h2 id="panel-title">Messages</h2>
        <button class="icon-btn" id="panel-close" aria-label="Close panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="panel-body" id="panel-body"></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="nav-scrim" id="nav-scrim"></div>
</div>

<div class="help" id="help" hidden>
  <div class="help-box" role="dialog" aria-label="Keyboard shortcuts">
    <div class="help-head"><strong>Keyboard shortcuts</strong><button class="icon-btn" id="help-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul id="help-list"></ul>
  </div>
</div>
<div class="tour" id="tour" hidden></div>

<div class="palette" id="palette" hidden>
  <div class="palette-box" id="palette-box" role="dialog" aria-label="Search and go to">
    <label class="palette-input">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
      <input id="palette-input" type="text" placeholder="Search people, pages and actions" autocomplete="off" spellcheck="false">
      <span class="kbd">Esc</span>
    </label>
    <ul id="palette-list" role="listbox"></ul>
    <div class="palette-foot"><span><span class="kbd">↑↓</span> move</span><span><span class="kbd">↵</span> open</span></div>
  </div>
</div>

<nav class="tabbar" id="tabbar" aria-label="Quick access">
  <button data-tab="home" data-go="/home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-5v-6h-4v6H5a1 1 0 01-1-1v-9z"/></svg><span>Home</span></button>
  <button data-tab="menu" id="tab-menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span></button>
  <button data-tab="search" id="tab-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg><span>Search</span></button>
  <button data-tab="chat" id="tab-chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 016.5 3h11A2.5 2.5 0 0120 5.5v8a2.5 2.5 0 01-2.5 2.5H9l-5 4v-4H6.5A2.5 2.5 0 014 13.5v-8z"/></svg><span>Messages</span><span class="dot" id="tab-chat-dot" hidden></span></button>
  <button data-tab="bell" id="tab-bell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0112 0v5l1.5 2h-15L6 16zM10 20a2 2 0 004 0"/></svg><span>Alerts</span><span class="dot" id="tab-bell-dot" hidden></span></button>
</nav>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="data.js"></script>
<script src="avatars.js"></script>
<script src="app.js"></script>
</body>
</html>
